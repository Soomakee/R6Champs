<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #root {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    -webkit-app-region: drag;
  }
  img {
    max-width: 96%; max-height: 96%;
    -webkit-app-region: drag; -webkit-user-drag: none; user-select: none;
    background: rgba(128,128,128,0.14);
    border-radius: 4px;
    outline: 1px solid rgba(60,60,60,0.85);
    outline-offset: -1px;
    filter: drop-shadow(0 0 6px rgba(0,0,0,0.55));
  }
</style>
</head>
<body>
<div id="root"><img id="img" draggable="false" /></div>
<script>
  const img = document.getElementById('img')
  window.minimapAPI.onSrc((src) => { img.src = src })
  window.minimapAPI.onBg((v) => {
    img.style.background = v > 0 ? `rgba(128,128,128,${v})` : 'transparent'
  })
  img.addEventListener('dblclick', () => window.minimapAPI.close())
</script>
</body>
</html>
