<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Theme Park Map - R6Champs Tactical Map Reference">
    <title>Theme Park - R6Champs</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../favicon.png">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- Header Navigation -->
    <header class="main-header">
        <div class="nav-container">
            <!-- Left Navigation -->
            <nav class="nav-left">
                <a href="../index.html" class="nav-btn active">Maps</a>
                <a href="roadmap.html" class="nav-btn">Roadmap</a>
                <a href="special-thanks.html" class="nav-btn">Special Thanks</a>
            </nav>
            
            <!-- Center Logo -->
            <div class="nav-center">
                <div class="logo">R6Champs</div>
            </div>
            
            <!-- Right Navigation -->
            <nav class="nav-right">
                <a href="submit-bug.html" class="nav-btn">Bug Report</a>
                <a href="submit-feature.html" class="nav-btn">Feature</a>
                <a href="donate.html" class="btn-primary">Donate</a>
            </nav>
        </div>
    </header>

    <!-- Edit Mode Banner -->
    <div id="edit-mode-banner" class="edit-mode-banner">
        EDIT MODE - Make changes and click Save Strategy when done
    </div>

    <!-- Map Page Content with Sidebar -->
    <main class="map-page-with-sidebar">
        <!-- Strategy Sidebar -->
        <aside id="strategy-sidebar" class="strategy-sidebar">
            <!-- Populated by strategies.js -->
        </aside>

        <!-- Main Map Area -->
        <div class="map-main-area">
            <!-- Map Header with Title and Floor Tabs -->
            <div class="map-header">
                <h1 class="map-title">Theme Park</h1>
                <div id="floor-tabs" class="floor-tabs">
                    <!-- Floor tabs will be generated by JavaScript -->
                </div>
            </div>

            <!-- Map Display with Canvas Overlay -->
            <div class="map-display-container">
                <div id="map-image-container" class="map-image-wrapper">
                    <!-- Floor images will be generated by JavaScript -->
                </div>
                
                <!-- Icon Toolbar (hidden by default, shown in edit mode) -->
                <div id="icon-toolbar" class="icon-toolbar" style="display: none;">
                    <!-- Populated by strategies.js -->
                </div>
                
                <!-- Drawing Toolbar -->
                <div class="drawing-toolbar">
                    <!-- Draw mode: must be On to draw (prevents accidental draw when scrolling) -->
                    <div class="tool-group">
                        <button id="draw-mode-toggle" class="tool-btn draw-mode-toggle" title="Enable drawing (tap to draw on map)">Drawing: Off</button>
                    </div>
                    <!-- Tool Selection -->
                    <div class="tool-group">
                        <span class="tool-label">Tools:</span>
                        <button id="tool-pencil" class="tool-btn pencil" title="Pencil (P)">
                            ✏️
                        </button>
                        <button id="tool-eraser" class="tool-btn eraser" title="Eraser (E)">
                            🧹
                        </button>
                    </div>
                    
                    <!-- Brush Size -->
                    <div class="tool-group">
                        <span class="tool-label">Size:</span>
                        <div class="brush-size-container">
                            <input 
                                type="range" 
                                id="brush-size" 
                                class="brush-slider" 
                                min="1" 
                                max="50" 
                                value="4"
                            >
                            <div class="brush-preview">
                                <div id="brush-dot" class="brush-dot"></div>
                            </div>
                            <span id="brush-size-display">4px</span>
                        </div>
                    </div>
                    
                    <!-- Color Picker -->
                    <div class="tool-group">
                        <span class="tool-label">Color:</span>
                        <div class="color-picker-wrapper">
                            <input 
                                type="color" 
                                id="brush-color" 
                                class="color-picker" 
                                value="#e63946"
                            >
                        </div>
                    </div>
                    
                    <!-- Clear Button -->
                    <div class="tool-group">
                        <button id="tool-clear" class="clear-btn" title="Clear Canvas (Ctrl+C)">
                            Clear
                        </button>
                    </div>
                    
                    <!-- Save Strategy Button (hidden by default) -->
                    <div class="tool-group">
                        <button id="save-strat-btn" class="btn-primary" style="display: none;">
                            💾 Save Strategy
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Save Strategy Modal -->
    <div id="save-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="modal-title">Save Strategy</h2>
            <div class="form-group">
                <label class="form-label" for="strategy-name-input">Strategy Name</label>
                <input type="text" id="strategy-name-input" class="form-input" placeholder="Enter strategy name...">
            </div>
            <div class="modal-buttons">
                <button id="confirm-save-btn" class="modal-btn primary">Save</button>
                <button id="cancel-save-btn" class="modal-btn secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Floor Data Configuration -->
    <script>
        // Define floor data for Theme Park map
        window.mapName = 'Theme Park';
        window.mapFloorsData = [
            {
                id: 'ground-floor',
                label: 'Ground Floor',
                image: '../Images/MapBlueprints/Theme Park/Ground Floor.webp'
            },
            {
                id: 'top-floor',
                label: 'Top Floor',
                image: '../Images/MapBlueprints/Theme Park/Top Floor.webp'
            }
        ];
    </script>

    <!-- External JavaScript -->
    <script src="../js/main.js"></script>
    <script src="../js/drawing.js"></script>
    <script src="../js/strategies.js"></script>
    
    <!-- Initialize Strategy Sidebar -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Wait for floor tabs to be initialized
            setTimeout(() => {
                StrategyManager.initialize('map14', window.mapFloorsData);
            }, 100);
        });
    </script>
</body>
</html>
